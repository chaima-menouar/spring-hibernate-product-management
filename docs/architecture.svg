<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="320" viewBox="0 0 1150 320" role="img" aria-labelledby="title desc"><title id="title">Spring Hibernate Product Management architecture</title><desc id="desc">JSP views call Spring MVC controllers, services, DAO, Hibernate ORM, and MySQL.</desc><defs><style>.b{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:14}.t{font:600 19px Arial,sans-serif;fill:#0f172a}.s{font:14px Arial,sans-serif;fill:#475569}.a{stroke:#64748b;stroke-width:3;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#64748b"/></marker></defs><rect class="b" x="25" y="110" width="170" height="90"/><text class="t" x="110" y="145" text-anchor="middle">JSP Views</text><text class="s" x="110" y="174" text-anchor="middle">product UI</text><rect class="b" x="240" y="110" width="170" height="90"/><text class="t" x="325" y="145" text-anchor="middle">Spring MVC</text><text class="s" x="325" y="174" text-anchor="middle">controllers</text><rect class="b" x="455" y="110" width="170" height="90"/><text class="t" x="540" y="145" text-anchor="middle">Service</text><text class="s" x="540" y="174" text-anchor="middle">business logic</text><rect class="b" x="670" y="110" width="170" height="90"/><text class="t" x="755" y="145" text-anchor="middle">DAO</text><text class="s" x="755" y="174" text-anchor="middle">ProduitDao</text><rect class="b" x="885" y="110" width="170" height="90"/><text class="t" x="970" y="145" text-anchor="middle">Hibernate</text><text class="s" x="970" y="174" text-anchor="middle">MySQL persistence</text><line class="a" x1="195" y1="155" x2="240" y2="155"/><line class="a" x1="410" y1="155" x2="455" y2="155"/><line class="a" x1="625" y1="155" x2="670" y2="155"/><line class="a" x1="840" y1="155" x2="885" y2="155"/></svg>